async function sb(path, options = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json",
      ...options.method === "POST" || options.method === "PATCH" ? { Prefer: "return=representation" } : {},
      ...options.headers
    }
  });
  if (!res.ok) {
    const body = await res.text();
    const err = new Error(`Supabase ${options.method || "GET"} ${path} \u2192 ${res.status}: ${body}`);
    err.status = res.status;
    try {
      const j = JSON.parse(body);
      err.dbCode = j.code;
      err.dbMessage = j.message;
    } catch (e) {
    }
    throw err;
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}
async function uploadDocumentPhoto(file) {

  const path = `${Date.now()}-${safeName}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/documentos/${path}`, {
    method: "POST",
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      "Content-Type": file.type || "application/octet-stream"
    },
    body: file
  });
  if (!res.ok) {
    const body = await res.text();
    throw new Error(`Subida de archivo \u2192 ${res.status}: ${body}`);
  }
  return `${SUPABASE_URL}/storage/v1/object/public/documentos/${path}`;
}

function sendConfirmationEmail(toEmail, toName, partySize, date, slot, area, lang) {
  if (!EMAILJS_PUBLIC_KEY || !EMAILJS_SERVICE_ID || !EMAILJS_TEMPLATE_ID) return Promise.resolve(false);
  if (!toEmail || !toEmail.trim()) return Promise.resolve(false);
  if (typeof window === "undefined" || !window.emailjs) return Promise.resolve(false);
  return window.emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
    to_email: toEmail,
    to_name: toName,
    party_size: partySize,
    res_date: date,
    res_time: slot,
    res_area: area,
    lang: lang || "es"
  }).then(() => true).catch((err) => {
    console.error("No se pudo mandar el email de confirmaci\xF3n:", err);
    return false;
  });
}

function waLink(phone, text) {
  let digits = String(phone || "").replace(/[^\d+]/g, "");
  if (!digits) return null;
  if (digits.startsWith("+")) digits = digits.slice(1);
  else if (digits.startsWith("00")) digits = digits.slice(2);
  else if (/^[6-9]\d{8}$/.test(digits)) digits = "34" + digits;
  if (digits.length < 8) return null;
  return `https://wa.me/${digits}?text=${encodeURIComponent(text)}`;
}
